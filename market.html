
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Market | TechFixIT</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --text: #334155;
            --card-bg: #ffffff;
            --border: #e2e8f0;
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --text: #f1f5f9;
            --card-bg: #1e293b;
            --border: #334155;
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            overflow-x: hidden;
            transition: background 0.3s ease;
        }

        nav {
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
        }

        .logo { font-weight: 800; color: var(--primary); text-decoration: none; }

        .market-container {
            max-width: 1200px;
            margin: 80px auto;
            position: relative;
            padding: 0 50px;
        }

        .carousel-viewport {
            overflow: hidden;
            position: relative;
            padding: 20px 0;
        }

        .carousel-track {
            display: flex;
            gap: 20px;
        }

        .service-card {
            min-width: calc(33.333% - 14px);
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            user-select: none;
        }

        .service-card h2 { color: var(--primary); margin-bottom: 15px; font-size: 1.5rem; }
        .service-card p { font-size: 1rem; opacity: 0.8; }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }

        .nav-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .nav-btn:hover { opacity: 0.9; }

        @media (max-width: 900px) {
            .service-card { min-width: calc(50% - 10px); }
        }
        @media (max-width: 600px) {
            .service-card { min-width: 100%; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">TechFixIT // MARKET</a>
        <div class="nav-controls">
            <a href="index.html" style="text-decoration:none; color:var(--primary); font-size: 0.9rem;">Back to Help</a>
        </div>
    </nav>

    <div class="market-container">
        <div class="carousel-viewport">
            <div class="carousel-track" id="carouselTrack">
                <!-- JS will inject cards here -->
            </div>
        </div>

        <div class="controls">
            <button class="nav-btn" id="prevBtn">Prev</button>
            <button class="nav-btn" id="nextBtn">Next</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
